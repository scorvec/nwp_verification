<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model verification</title>
<!-- Reference viewer for mverify scorecard JSON. Dependency-free; drop it next to scores.json
     (or pass ?src=URL) and it draws one lead-time chart per truth x variable x region. -->
<style>
  :root { --bg: #fff; --fg: #1d232b; --muted: #5f6b7a; --grid: #e3e7ec; --card: #f6f8fa;
          --s1: #2f6fde; --s2: #d9480f; --s3: #2b8a3e; --s4: #862e9c; --s5: #c2255c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --fg: #e6ebf0; --muted: #94a1b2; --grid: #2a323c; --card: #182029;
            --s1: #6ea0ff; --s2: #ff8a50; --s3: #63c174; --s4: #c77dff; --s5: #f06595; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px; }
  select { font: inherit; padding: 4px 6px; background: var(--card); color: var(--fg); border: 1px solid var(--grid); border-radius: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { background: var(--card); border-radius: 10px; padding: 10px 12px; }
  .card h2 { font-size: .95rem; margin: 0; }
  .card .sub { color: var(--muted); font-size: .8rem; }
  svg { width: 100%; height: auto; display: block; }
  .axis { stroke: var(--grid); } .lbl { fill: var(--muted); font-size: 10px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8rem; margin-top: 4px; }
  .legend i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<main>
  <h1>Model verification</h1>
  <div class="meta" id="meta">Loading…</div>
  <div class="controls">
    <label>Score <select id="stat"></select></label>
    <label>Region <select id="region"></select></label>
    <label>Truth <select id="truth"></select></label>
  </div>
  <div class="grid" id="charts"></div>
</main>
<script>
const COLORS = ["--s1", "--s2", "--s3", "--s4", "--s5"].map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const NAMES = {
  rmse: "RMSE", rmse_oc: "RMSE, observation error removed", bias: "Bias (forecast − observed)", mae: "MAE",
  corr: "Correlation", crps: "CRPS", crps_oe: "CRPS, observation error included", spread: "Spread",
  spread_oe: "Spread incl. observation error", ssr: "Spread/skill", ssr_oe: "Spread/skill incl. observation error",
  n: "Pairs",
};
const UNITLESS = new Set(["corr", "ssr", "ssr_oe", "n"]);
const src = new URLSearchParams(location.search).get("src") || "scores.json";
const $ = id => document.getElementById(id);

function options(sel, values, labels = {}) {
  sel.innerHTML = values.map(v => `<option value="${v}">${labels[v] || v}</option>`).join("");
}

function chart(row, card, stat) {
  const W = 320, H = 180, L = 40, R = 8, T = 8, B = 24;
  const leads = card.leads, models = Object.keys(row.scores);
  const series = models.map(m => (row.scores[m][stat] || []).map((v, i) => [leads[i], v]).filter(p => p[1] !== null));
  const ys = series.flat().map(p => p[1]);
  if (!ys.length) return null;
  let lo = Math.min(...ys, stat === "bias" ? 0 : Infinity), hi = Math.max(...ys);
  if (stat !== "bias" && stat !== "corr") lo = Math.min(lo, 0);
  if (hi === lo) hi = lo + 1;
  const x = v => L + (v - leads[0]) / Math.max(1, leads[leads.length - 1] - leads[0]) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${row.label} ${stat}">`;
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${+v.toPrecision(3)}</text>`;
  }
  leads.forEach((ld, i) => { if (i % Math.ceil(leads.length / 8) === 0) s += `<text class="lbl" x="${x(ld)}" y="${H - 8}" text-anchor="middle">${ld}h</text>`; });
  series.forEach((pts, i) => {
    const c = COLORS[i % COLORS.length];
    s += `<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(p => x(p[0]) + "," + y(p[1])).join(" ")}"/>`;
    pts.forEach(p => s += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="2.5" fill="${c}"><title>${models[i]} ${p[0]}h: ${p[1]}</title></circle>`);
  });
  return s + "</svg>";
}

function draw(card) {
  const stat = $("stat").value, region = $("region").value, truth = $("truth").value;
  const rows = card.rows.filter(r => r.region === region && r.truth === truth);
  $("charts").innerHTML = rows.map(r => {
    const svg = chart(r, card, stat);
    if (!svg) return "";
    const legend = Object.keys(r.scores).map((m, i) => `<span><i style="background:${COLORS[i % COLORS.length]}"></i>${m}</span>`).join("");
    return `<div class="card"><h2>${r.label}</h2><div class="sub">${NAMES[stat]}${UNITLESS.has(stat) ? "" : " (" + r.unit + ")"}</div>${svg}<div class="legend">${legend}</div></div>`;
  }).join("") || "<p>No scores for this selection.</p>";
}

fetch(src + (src.includes("?") ? "&" : "?") + "v=" + Date.now()).then(r => r.json()).then(card => {
  $("meta").textContent = `${card.models.join(", ")} · updated ${card.generated} · ${card.package}`;
  const stats = Object.keys(NAMES).filter(s => card.rows.some(r => Object.values(r.scores).some(m => m[s])));
  options($("stat"), stats, NAMES);
  options($("region"), [...new Set(card.rows.map(r => r.region))]);
  options($("truth"), [...new Set(card.rows.map(r => r.truth))]);
  ["stat", "region", "truth"].forEach(id => $(id).onchange = () => draw(card));
  draw(card);
}).catch(e => { $("meta").textContent = "Could not load " + src + ": " + e; });
</script>
</body>
</html>
